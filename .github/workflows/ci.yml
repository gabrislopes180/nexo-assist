name: CI - Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    env:
      API_PROXY_TARGET: http://localhost:8000

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Config Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type verification (TypeScript)
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Building application test
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./ci.db

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Config Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type verification (TypeScript)
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Building application test
        run: npm run build
